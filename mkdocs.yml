site_name: OSARA Open Standard
site_description: Open Sovereign Agent Reference Architecture and AI Bill of Rights
site_url: https://elkordym.github.io/osara-open-standard
repo_url: https://github.com/elkordym/osara-open-standard
docs_dir: docs
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: teal
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Governance: governance.md
  - Branching Strategy: BRANCHING_STRATEGY.md
  - Community Communication: COMMUNITY_COMMUNICATION.md
  - Roadmap: ROADMAP.md
  - Versioning: VERSIONING.md
  - Release Process: RELEASE_PROCESS.md
  - GitHub Setup: GITHUB_SETUP.md
  - Specifications:
      - OSARA (Current): specs/osara/current.md
      - OSARA v0.3 Draft.1: specs/osara/releases/v0.3-draft.1.md
      - AI Bill of Rights (Current): specs/ai-bill-of-rights/current.md
      - AI Bill of Rights v1.0 Draft.1: specs/ai-bill-of-rights/releases/v1.0-draft.1.md
