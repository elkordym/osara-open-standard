site_name: OSARA Open Standard
site_description: Open Sovereign Agent Reference Architecture and AI Bill of Rights — published by Open Source United
site_url: https://elkordym.github.io/osara-open-standard
repo_url: https://github.com/elkordym/osara-open-standard
docs_dir: docs
copyright: Published by Open Source United, a Community of Practice of the United Nations.
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: teal
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
extra:
  generator: false
nav:
  - Home: index.md
  - Start Here: getting-started.md
  - Standards:
      - OSARA Overview:
          - Current Draft: specs/osara-overview/current.md
          - v0.4 Draft.1: specs/osara-overview/releases/v0.4-draft.1.md
      - OSARA Specification:
          - Current Draft: specs/osara/current.md
          - v0.4 Draft.1: specs/osara/releases/v0.4-draft.1.md
          - v0.3 Draft.1: specs/osara/releases/v0.3-draft.1.md
      - AI Bill of Rights:
          - Current Draft: specs/ai-bill-of-rights/current.md
          - v1.1 Draft.1: specs/ai-bill-of-rights/releases/v1.1-draft.1.md
          - v1.0 Draft.1: specs/ai-bill-of-rights/releases/v1.0-draft.1.md
      - Threat Model:
          - Current Draft: specs/osara-threat-model/current.md
          - v0.4 Draft.1: specs/osara-threat-model/releases/v0.4-draft.1.md
      - Privacy Considerations:
          - Current Draft: specs/osara-privacy/current.md
          - v0.4 Draft.1: specs/osara-privacy/releases/v0.4-draft.1.md
  - Governance:
      - Overview: governance.md
      - Charter: governance/CHARTER.md
      - IPR Policy: governance/IPR_POLICY.md
      - Maintainers: governance/MAINTAINERS.md
      - Implementation Report Template: governance/IMPLEMENTATION_REPORT_TEMPLATE.md
      - Liaisons: governance/LIAISONS.md
      - Decision Record Template: governance/DECISION_RECORD_TEMPLATE.md
      - Branching Strategy: BRANCHING_STRATEGY.md
      - Versioning: VERSIONING.md
      - Release Process: RELEASE_PROCESS.md
      - Errata: errata.md
      - Changelog: CHANGELOG.md
      - Community Communication: COMMUNITY_COMMUNICATION.md
  - Participate:
      - Code of Conduct: community/CODE_OF_CONDUCT.md
      - Contributing: community/CONTRIBUTING.md
      - Public Comments Register: comments-register.md
      - Community Communication: COMMUNITY_COMMUNICATION.md
  - Roadmap: ROADMAP.md
